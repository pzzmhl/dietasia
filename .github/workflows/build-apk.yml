name: Build Android APK (Coraline Tracker)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: |
          npm install

      - name: 🛠️ Build Web Application
        run: |
          npm run build

      - name: 🤖 Initialize & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Cartella android non trovata: aggiunta della piattaforma..."
            npx cap add android
          fi
          echo "Sincronizzazione asset web con la piattaforma Android..."
          npx cap sync android

      - name: 🔑 Grant execute permissions to Gradle wrapper
        run: |
          chmod +x android/gradlew

      - name: ⚙️ Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Coraline-Tracker-Beta.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coraline-Tracker-Beta-APK
          path: Coraline-Tracker-Beta.apk
          if-no-files-found: error
          retention-days: 30

