name: Build Android APK (Coraline Tracker)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crea una GitHub Release ufficiale'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag della Release (es. v2.6.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠️ Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://pcsdihhbctvdtrolojmd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjc2RpaGhiY3R2ZHRyb2xvam1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTY3MjUsImV4cCI6MjEwOTE5MjcyNX0.3MFtRWCScum4i94eFWipIR9F3okTPHV7l_NW4kaXixo' }}
        run: npm run build

      - name: 🤖 Sync Android Platform
        run: npx cap sync android

      - name: 🔑 Grant execute permissions to Gradle wrapper
        run: chmod +x android/gradlew

      - name: ⚙️ Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Coraline-Tracker-Beta.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coraline-Tracker-Beta-APK
          path: Coraline-Tracker-Beta.apk
          if-no-files-found: error
          retention-days: 30

      # Pulisce le release orfane intermedie su GitHub mantenendo v1.0-beta e v2.5-beta
      - name: 🧹 Cleanup intermediate releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in v1.1-beta v1.2-beta v1.3-beta v1.4-beta v1.5-beta v1.6-beta v1.7-beta v1.8-beta v1.9-beta v2.0-beta v2.1-beta v2.2-beta v2.3-beta v2.4-beta; do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done

      # Crea una nuova release ufficiale SOLO su tag esplicito 'v*' o dispatch con create_release=true
      - name: 📦 Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        with:
          files: Coraline-Tracker-Beta.apk
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Coraline Tracker ${{ inputs.tag_name || github.ref_name }}
          body: |
            ### 🪡 Coraline Tracker per Asia
            - File APK pronto per installazione su Android: scarica il file **Coraline-Tracker-Beta.apk** qui sotto.
            - Esperienza nativa a tema Coraline (fasi lunari, bottoni neri, chiavi jolly, allenamenti Bobinsky).
            - Dashboard con statistiche storiche comparative e scorrimento a carosello.
            - Easter egg segreti della porticina e gatto tutor.
